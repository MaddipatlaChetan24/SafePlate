[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safeplate"
version = "1.0.0"
description = "AI recipe assistant with constraint self-checking, pantry tracking, a cookbook and meal planning"
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
web = ["streamlit>=1.35"]
dev = ["pytest>=8.0"]

[project.scripts]
safeplate = "safeplate.cli:main"

[tool.setuptools]
packages = ["safeplate"]

[tool.setuptools.package-data]
safeplate = ["web/*"]
