[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recipe-agent"
version = "1.0.0"
description = "AI recipe assistant with constraint self-checking, pantry tracking, a cookbook and meal planning"
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
web = ["streamlit>=1.35"]
dev = ["pytest>=8.0"]

[project.scripts]
recipe-agent = "recipe_agent.cli:main"

[tool.setuptools]
packages = ["recipe_agent"]
